name: Private preview setup
on:
  push:
    branches: ['codex/private-preview-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      AKAIV_PREVIEW_CI: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_pgsql, bcmath, exif, pcntl, zip, gd, redis
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install preview runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php8.3-fpm nginx supervisor rsync
          sudo systemctl stop nginx php8.3-fpm supervisor
      - name: Validate setup syntax
        run: |
          bash -n .devcontainer/post-create.sh .devcontainer/preview/start.sh
          python3 -m py_compile .devcontainer/preview/prepare.py .devcontainer/preview/render.py
          php -l .devcontainer/preview/seed.php
      - name: Build isolated preview
        run: bash .devcontainer/post-create.sh
      - name: Browser checks
        working-directory: .preview/app
        run: |
          npx playwright install --with-deps chromium
          cp ../../.devcontainer/preview/smoke.mjs preview-smoke.mjs
          node preview-smoke.mjs
      - name: Verify repeat setup preserves credentials and records
        run: |
          sha256sum .preview/app/.env .preview/logins.json > /tmp/preview-state.sha256
          bash .devcontainer/post-create.sh
          sha256sum -c /tmp/preview-state.sha256
          cd .preview/app
          node preview-smoke.mjs
      - name: Failure diagnostics
        if: failure()
        run: |
          for file in .preview/fpm-error.log .preview/nginx-error.log .preview/queue.log .preview/app/storage/logs/laravel.log; do
            test ! -f "$file" || tail -60 "$file"
          done
