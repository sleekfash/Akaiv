name: akaiv-preview
services:
  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: akaiv_preview_pilot_test
      POSTGRES_USER: preview
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run preview preparation}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["database:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preview -d akaiv_preview_pilot_test"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Run preview preparation}"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["queue:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  storage:
    build:
      context: .
      dockerfile: Minio.Dockerfile
    environment:
      MINIO_ROOT_USER: preview
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?Run preview preparation}
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    ports: ["127.0.0.1:9000:9000"]
    volumes: ["objects:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
  clamav:
    image: clamav/clamav:stable
    ports: ["127.0.0.1:3310:3310"]
    volumes: ["signatures:/var/lib/clamav"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      start_period: 120s
      interval: 10s
      timeout: 10s
      retries: 60
volumes:
  database:
  queue:
  objects:
  signatures:
